<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C# / .NET job matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("jobs-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{color-scheme:light;
 --bg:#e9eef3;--card:#fff;--ink:#13202e;--muted:#566677;--line:#d6dee7;--line-strong:#bcc8d4;
 --accent:#17345c;--accent-soft:#e1ebf7;--on-accent:#fff;--hot:#ff5a36;--hot-ink:#fff;
 --f0:#0fa56b;--f1:#1b8fd1;--f2:#f2a413;--f3:#8794a3;
 --b0:#0b3f9e;--b1:#1a5fd0;--b2:#3f74b8;--b3:#5a7191;
 --fo0:#fff;--fo1:#fff;--fo2:#2a1c00;--fo3:#fff;
 --match:#e6f6ee;--match-edge:#0fa56b;--gap:#fff3dc;--gap-edge:#f2a413;--danger:#b3261e;
 --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0c1218;--card:#151e28;--ink:#e8eef4;--muted:#9aaab9;--line:#25323f;--line-strong:#374757;
 --accent:#8cc8ff;--accent-soft:#1a2c40;--on-accent:#07131f;--hot:#ff7a59;--hot-ink:#1a0a05;
 --f0:#2fd391;--f1:#4fb0f0;--f2:#f7b83d;--f3:#8e9bab;
 --b0:#b3d4ff;--b1:#86b6f7;--b2:#6f9dd6;--b3:#8195ad;
 --fo0:#04251a;--fo1:#051a29;--fo2:#2a1c00;--fo3:#10171e;
 --match:#13281f;--match-edge:#2fd391;--gap:#2b2312;--gap-edge:#f7b83d;--danger:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

header{background:var(--accent);color:var(--on-accent)}
.bar{max-width:1200px;margin:0 auto;padding:22px 28px;display:flex;flex-wrap:wrap;gap:14px 32px;align-items:center}
h1{font:800 1.75rem/1.05 var(--display);letter-spacing:-.03em;margin:0 auto 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:.84rem;opacity:.92}
.stats span{display:flex;align-items:baseline;gap:7px}
.stats b{font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
header .theme{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 45%,transparent)}
header .theme:hover{background:color-mix(in srgb,var(--on-accent) 14%,transparent);color:var(--on-accent);border-color:var(--on-accent)}

.layout{max-width:1200px;margin:0 auto;padding:24px 28px 28px}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px;margin-bottom:22px}
aside h2{font:700 1.05rem var(--display);margin:0;letter-spacing:-.01em}
.fhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
#flt{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fgrid{display:flex;flex-wrap:wrap;gap:12px}
.fgrid .f{margin:0;flex:1 1 130px;min-width:0}
.fgrid .f.wide{flex:2 1 220px}
.fgrid select,.fgrid input[type=search]{width:100%}
.frow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;margin-top:14px}
.opts,.acts{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.opts .chk{margin:0}
.acts{gap:8px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;font-size:.84rem;font-weight:500;color:var(--muted)}
.chk{display:flex;gap:9px;align-items:center;margin:9px 0;font-size:.92rem;color:var(--ink);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
input[type=search],select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
input[type=search]:hover,select:hover{border-color:var(--line-strong)}
button{cursor:pointer;background:var(--card);font-weight:500}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.theme{display:flex;gap:6px;align-items:center;font-size:.86rem}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.primary:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.12)}
#reset,#change{color:var(--muted)}
.msg{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:0 0 8px}
.count{color:var(--muted);font-size:.88rem;margin:0 0 14px}

/* job cards: title first in a blue grade, fit + score beside it */
.job{--fc:var(--f3);--tc:var(--b3);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:14px;margin:0 0 14px;padding:18px 22px 14px}
.job.done{opacity:.6}
.jobtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 20px}
.jt{min-width:0}
.job h2{font:800 1.4rem/1.25 var(--display);letter-spacing:-.025em;margin:0;max-width:60ch}
.job h2 a{color:var(--tc);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 3px no-repeat;transition:background-size .2s}
.job h2 a:hover{background-size:100% 3px}
.job h2 span{color:var(--tc)}
.company{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:.93rem;color:var(--muted)}
.company .co{color:var(--ink);font-weight:600}
.rank{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.fit{display:inline-flex;align-items:center;gap:9px;font-size:.84rem;font-weight:600;padding:3px 12px 3px 10px;border-radius:999px;background:color-mix(in srgb,var(--fc) 16%,var(--card));color:var(--ink);white-space:nowrap}
.meter{display:flex;align-items:flex-end;gap:2px}
.meter i{width:4px;border-radius:1.5px;background:var(--fc);opacity:.3}
.meter i:nth-child(1){height:6px}.meter i:nth-child(2){height:9px}.meter i:nth-child(3){height:12px}.meter i:nth-child(4){height:15px}
.meter i.on{opacity:1}
.score{display:none;font:700 .86rem/1.5 var(--display);font-variant-numeric:tabular-nums;padding:1px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.show-scores .score{display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:12px}
.tag{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.new{background:var(--hot);color:var(--hot-ink)}
.tag.sen{background:transparent;border:1.5px solid var(--accent)}
.tag.src{background:var(--bg);color:var(--muted)}
.apply{display:flex;gap:7px;align-items:center;white-space:nowrap;font-size:.88rem;font-weight:600;cursor:pointer;padding:4px 11px;border:1.5px solid var(--line-strong);border-radius:8px;color:var(--muted);margin-left:auto}
.apply:hover{border-color:var(--accent);color:var(--accent)}
.apply:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.apply input{width:16px;height:16px;accent-color:var(--hot)}
.why{border-top:1px solid var(--line);margin:14px -22px 0;padding:14px 22px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 32px}
.facts{display:grid;gap:12px}
.fact{border-left:3px solid var(--line-strong);padding-left:14px;min-width:0;max-width:70ch;font-size:.93rem;line-height:1.6}
.fact.m{border-left-color:var(--match-edge)}
.fact.g{border-left-color:var(--gap-edge)}
.fact b{display:block;font-size:.84rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.why details{margin-top:12px}
summary{cursor:pointer;color:var(--accent);font-size:.88rem;font-weight:600}
details .facts{margin-top:10px}
.found{color:var(--muted);font-size:.8rem;margin:12px 0 0}
.empty{padding:44px 24px;text-align:center;background:var(--card);border:1px dashed var(--line-strong);border-radius:16px;color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:22px 0}
.pager .cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{color:var(--muted);font-size:.84rem;text-align:center;margin:24px 0 0}

@media(max-width:820px){.layout{padding:16px}.bar{padding:16px}
 .job{padding:14px 16px 12px}.why{margin:12px -16px 0;padding:12px 16px 0}.cols{grid-template-columns:1fr}.jobtop{flex-direction:column}.rank{flex-direction:row;flex-wrap:wrap;align-items:center}}
@media(prefers-reduced-motion:reduce){.job h2 a{transition:none}}
</style></head><body>
<header><div class="bar"><h1>C# / .NET job matches</h1>
<div class="stats" id="stat" aria-live="polite"></div>
<button class="theme" id="theme" aria-label="Switch between light and dark theme"></button></div></header>
<div class="layout">
<aside><div class="fhead"><h2>Filter and sort</h2>
<button class="primary" id="open">Select job folder</button></div>
<div id="flt" hidden>
<div class="fgrid">
<label class="f wide">Search<input type="search" id="q" placeholder="Title, company, stack"></label>
<label class="f">Fit<select id="fit"><option value="">All</option><option>Very strong</option><option>Strong</option><option>Possible</option><option>Weak</option></select></label>
<label class="f">Level<select id="lvl"><option value="">All</option><option value="level">At my level</option><option value="senior">Senior / Lead</option></select></label>
<label class="f">City<select id="city"><option value="">All</option></select></label>
<label class="f">Source<select id="src"><option value="">All</option></select></label>
<label class="f">Sort by<select id="sort"><option value="fit">Fit</option><option value="new">Newest first</option><option value="company">Company</option><option value="title">Title</option></select></label>
</div>
<div class="frow"><div class="opts">
<label class="chk"><input type="checkbox" id="hide" checked>Hide applied</label>
<label class="chk"><input type="checkbox" id="onlyapp">Only applied</label>
<label class="chk"><input type="checkbox" id="onlynew">Only new jobs</label>
<label class="chk"><input type="checkbox" id="scores">Show match scores</label></div>
<div class="acts"><button id="reset">Reset filters</button><button id="change">Change folder</button></div></div></div></aside>
<section><p class="msg" id="msg" role="status"></p><p class="count" id="count"></p>
<div id="list"><div class="empty">Select the job folder to load your listings. You only need to do this once.</div></div>
<div class="pager" id="pager"></div>
<p class="note">Job availability and listing details can change. Applied marks are saved in data sources/applied.json.</p></section>
</div>
<script>
const FC={"Very strong":["var(--f0)","var(--b0)"],Strong:["var(--f1)","var(--b1)"],Possible:["var(--f2)","var(--b2)"],Weak:["var(--f3)","var(--b3)"]};
const PER=10,FIT={"Very strong":0,"Strong":1,"Possible":2,"Weak":3};
let root=null,jobs=[],applied={},page=1,newest="";
const $=s=>document.querySelector(s);
const key=j=>j.id||j.canonical_url;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
const say=t=>$("#msg").textContent=t||"";
function idb(mode,val){return new Promise((ok,no)=>{const r=indexedDB.open("jobs-ui",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onerror=no;
r.onsuccess=()=>{const s=r.result.transaction("h",mode==="get"?"readonly":"readwrite").objectStore("h");const q=mode==="get"?s.get("root"):s.put(val,"root");q.onsuccess=()=>ok(q.result);q.onerror=no}})}
async function dsDir(create){return root.getDirectoryHandle("data sources",{create})}
async function readJson(name,def){try{const f=await(await(await dsDir(false)).getFileHandle(name)).getFile();return JSON.parse(await f.text())}catch(e){return def}}
async function setApplied(url,on){
  const cur=await readJson("applied.json",{});          /* re-read so nothing written elsewhere is lost */
  if(on)cur[url]={status:"applied",date:new Date().toISOString().slice(0,10)};else delete cur[url];
  applied=cur;
  try{const h=await(await dsDir(true)).getFileHandle("applied.json",{create:true});const w=await h.createWritable();await w.write(JSON.stringify(cur,null,1));await w.close();say("")}
  catch(e){say("Could not save applied.json: "+e.message)}
  draw();
}
async function load(){
  jobs=await readJson("jobs.json",null);
  if(!Array.isArray(jobs)){jobs=[];say("data sources/jobs.json not found or invalid. Select the folder that contains index.html and the 'data sources' folder.");return}
  applied=await readJson("applied.json",{});
  newest=jobs.reduce((m,j)=>(j.first_seen||"")>m?(j.first_seen||""):m,"").slice(0,10);
  for(const [id,key] of [["city","search_city"],["src","source"]]){
    const sel=$("#"+id);sel.length=1;
    [...new Set(jobs.map(j=>j[key]).filter(Boolean))].sort().forEach(v=>sel.add(new Option(v,v)));
  }
  $("#flt").hidden=false;$("#open").textContent="Reload data";say("");page=1;draw();
}
async function pick(force = false) {
  try {
    if (!root || force) {
      root = await showDirectoryPicker({ mode: "readwrite" });
    }

    if (await root.requestPermission({ mode: "readwrite" }) !== "granted") {
      say("Permission needed to read and save.");
      return;
    }

    try {
      await load();
    } catch (e) {
      if (e.name !== "NotFoundError") throw e;

      say("Previously selected folder was not found. Please select it again.");

      root = await showDirectoryPicker({ mode: "readwrite" });

      if (await root.requestPermission({ mode: "readwrite" }) !== "granted") {
        say("Permission needed to read and save.");
        return;
      }

      await load();
    }

    await idb("put", root);

  } catch (e) {
    say(
      e.name === "AbortError"
        ? ""
        : "Folder access needs Edge or Chrome: " + e.message
    );
  }
}
function view(){
  const q=$("#q").value.toLowerCase(),f=$("#fit").value,l=$("#lvl").value,c=$("#city").value,s=$("#src").value;
  let r=jobs.filter(j=>{
    const done=!!applied[key(j)];
    if(done&&$("#hide").checked&&!$("#onlyapp").checked)return false;
    if($("#onlyapp").checked&&!done)return false;
    if($("#onlynew").checked&&(j.first_seen||"").slice(0,10)!==newest)return false;
    if(f&&j.fit!==f)return false;if(l&&j.seniority!==l)return false;
    if(c&&j.search_city!==c)return false;if(s&&j.source!==s)return false;
    return !q||[j.title,j.company,j.location,j.cv_matches,j.gaps,j.experience_and_seniority_requirements].join(" ").toLowerCase().includes(q)});
  const k=$("#sort").value,cmp={
    fit:(a,b)=>(FIT[a.fit]??9)-(FIT[b.fit]??9)||(b.score||0)-(a.score||0)||(b.first_seen||"").localeCompare(a.first_seen||""),
    new:(a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""),
    company:(a,b)=>(a.company||"").localeCompare(b.company||""),
    title:(a,b)=>(a.title||"").localeCompare(b.title||"")}[k];
  return r.sort(cmp);
}
function row(l,v,c){return v?`<div class="fact ${c||""}"><b>${l}</b>${esc(v)}</div>`:""}
function meter(fit){
  const n=fit in FIT?4-FIT[fit]:1;
  return `<span class="meter" aria-hidden="true">${[1,2,3,4].map(i=>`<i${i<=n?' class="on"':""}></i>`).join("")}</span>`;
}
function card(j){
  const done=!!applied[key(j)],isNew=(j.first_seen||"").slice(0,10)===newest,sen=j.seniority==="senior";
  const url=j.direct_listing_url||j.canonical_url;
  const [fc,tc]=FC[j.fit]||FC.Weak;
  const sc=typeof j.score==="number"?`<span class="score" title="Match score">Score ${Math.round(j.score*10)/10}</span>`:"";
  const tags=(isNew?'<span class="tag new">New</span>':"")+(sen?'<span class="tag sen">Senior</span>':"")+(done?`<span class="tag">Applied ${esc(applied[key(j)].date||"")}</span>`:"")+(j.source?`<span class="tag src">${esc(j.source)}</span>`:"");
  const company=(j.company?`<span class="co">${esc(j.company)}</span>`:"")+(j.location?`<span>${esc(j.location)}${j.nearby?" (nearby)":""}</span>`:"");
  const cols=row("Requirements",j.experience_and_seniority_requirements)+row("Matches your CV",j.cv_matches,"m");
  const more=row("Gaps",j.gaps,"g")+row("Caveats",(j.unverified?"Unverified. ":"")+(j.caveats||""),"g")+(sen?row("Stretch check",j.stretch_check,"g"):"");
  const why=(cols?`<div class="cols">${cols}</div>`:"")+(more?`<details><summary>Gaps and caveats</summary><div class="facts">${more}</div></details>`:"");
  return `<article class="job${done?" done":""}" style="--fc:${fc};--tc:${tc}">
  <div class="jobtop"><div class="jt"><h2>${url?`<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>`:`<span>${esc(j.title)}</span>`}</h2>
  <div class="company">${company}</div></div>
  <div class="rank"><span class="fit">${meter(j.fit)}${esc(j.fit)} fit</span>${sc}</div></div>
  <div class="tags">${tags}<label class="apply"><input type="checkbox" data-u="${esc(key(j))}" ${done?"checked":""}>Applied</label></div>
  ${why?`<div class="why">${why}</div>`:""}
  <p class="found">Found via ${esc(j.search_city)}, ${esc(j.search_terms)}, ${j.results_page==null?"API results, no page number":"results page "+esc(j.results_page)}. First seen ${esc((j.first_seen||"").slice(0,10))}.</p></article>`;
}
function draw(){
  const r=view(),pages=Math.max(1,Math.ceil(r.length/PER));page=Math.min(page,pages);
  const nApp=jobs.filter(j=>applied[key(j)]).length,nNew=jobs.filter(j=>(j.first_seen||"").slice(0,10)===newest).length;
  const st=(n,l)=>`<span><b>${n}</b>${l}</span>`;
  $("#stat").innerHTML=st(jobs.length,"jobs stored")+st(nNew,"newest run"+(newest?" ("+esc(newest)+")":""))+st(nApp,"applied");
  $("#count").textContent=r.length+" of "+jobs.length+" jobs shown";
  $("#list").innerHTML=r.length?r.slice((page-1)*PER,page*PER).map(card).join(""):`<div class="empty">No jobs match the current filters.</div>`;
  const b=(p,t,cur)=>`<button data-p="${p}" ${cur?'class="cur" aria-current="page"':""}>${t}</button>`;
  let h=`<button data-p="${page-1}" ${page<2?"disabled":""}>Previous</button>`;
  for(let p=1;p<=pages;p++)if(p===1||p===pages||Math.abs(p-page)<=2)h+=b(p,p,p===page);else if(Math.abs(p-page)===3)h+="…";
  $("#pager").innerHTML=h+`<button data-p="${page+1}" ${page>=pages?"disabled":""}>Next</button>`;
}
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("jobs-theme",t)}catch(e){}$("#theme").textContent=t==="dark"?"Light theme":"Dark theme";$("#theme").setAttribute("aria-pressed",t==="dark")};
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(document.documentElement.dataset.theme);
const setScores=on=>{document.body.classList.toggle("show-scores",on);$("#scores").checked=on;try{localStorage.setItem("jobs-scores",on?"1":"0")}catch(e){}};
$("#scores").onchange=e=>setScores(e.target.checked);
try{setScores(localStorage.getItem("jobs-scores")==="1")}catch(e){setScores(false)}
$("#open").onclick=pick;
$("#change").onclick=async()=>{try{root=await showDirectoryPicker({mode:"readwrite"});await idb("put",root);page=1;await load()}catch(e){say(e.name==="AbortError"?"":"Could not open folder: "+e.message)}};
$("#reset").onclick=()=>{["q","fit","lvl","city","src"].forEach(i=>$("#"+i).value="");$("#sort").value="fit";$("#hide").checked=true;$("#onlyapp").checked=false;$("#onlynew").checked=false;page=1;draw()};
$("#flt").addEventListener("input",e=>{if(e.target.id==="scores")return;page=1;draw()});
$("#list").addEventListener("change",e=>{if(e.target.dataset.u)setApplied(e.target.dataset.u,e.target.checked)});
$("#pager").addEventListener("click",e=>{const p=+e.target.dataset.p;if(p){page=p;draw();scrollTo(0,0)}});
(async()=>{
  if(!window.showDirectoryPicker){say("Open this page in Edge or Chrome to read the data folder and save applied marks.");return}
  try{root=await idb("get");if(root&&await root.queryPermission({mode:"readwrite"})==="granted")await load();else if(root)say("Click 'Select job folder' to reconnect.")}catch(e){}
})();
</script></body></html>
